<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — Alergen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --ground:#dcdfe0; --sheet:#fff; --ink:#131718; --muted:#667075; --line:#e1e5e6; --accent:#0e8a78; }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#060909; --sheet:#0e1315; --ink:#edf1f1; --muted:#96a1a5; --line:#222b2f; --accent:#3fc3ae; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; min-height: 100vh; display: grid; place-items: center;
         background: var(--ground); color: var(--ink);
         font-family: 'Inter Tight', system-ui, -apple-system, sans-serif; }
  .card { background: var(--sheet); max-width: 560px; width: 100%; padding: 56px 40px; border-radius: 14px; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .08em;
          text-transform: uppercase; color: var(--accent); }
  h1 { font-weight: 300; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: -.02em; margin: 14px 0 0; }
  p { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin: 16px 0 0; }
  a.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 22px; margin-top: 28px;
          border-radius: 999px; background: var(--ink); color: var(--sheet); text-decoration: none;
          font-size: 14px; font-weight: 500; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0 0; }
  small { display: block; margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <span class="mono">404 · tidak ditemukan</span>
    <h1>Halaman yang Anda cari tidak ada.</h1>
    <p>Tautan mungkin sudah berpindah. Semua informasi produk, panel alergen, dan cara kerja tersedia di halaman utama.</p>
    <a class="btn" href="/">Kembali ke beranda</a>
    <hr>
    <small>Alergen · Universitas Airlangga, Surabaya · info@alergen.unair.ac.id</small>
  </main>
</body>
</html>
