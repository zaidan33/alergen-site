<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alergen Expo — Asisten Pengunjung</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef4f2">
<meta name="description" content="Prototipe asisten pengunjung booth Alergen: tanya jawab, mengenali patch 10 alergen, kuis singkat, dan mode suara.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom setinggi layar (header, tab, area kerja, kotak ketik). Motif utama: patch 2 x 5 cm dengan 10 sumur. */
:root{
  --bg:#eef4f2;
  --surface:#ffffff;
  --ink:#0c2624;
  --ink2:#4b6360;
  --line:#d3e0dd;
  --accent:#00796b;
  --accent-ink:#ffffff;
  --accent-soft:#d9eeea;
  --sand:#e6d2ba;
  --on-sand:#3b2d1c;
  --alert:#b42318;
  --alert-soft:#fdecea;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1716;--surface:#122322;--ink:#e7f1ef;--ink2:#9db5b1;--line:#25403d;
    --accent:#4ccbb8;--accent-ink:#06201c;--accent-soft:#153a35;--sand:#5a4b3a;--on-sand:#f2e4d2;
    --alert:#ff8a80;--alert-soft:#3a1d1b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1716;--surface:#122322;--ink:#e7f1ef;--ink2:#9db5b1;--line:#25403d;
  --accent:#4ccbb8;--accent-ink:#06201c;--accent-soft:#153a35;--sand:#5a4b3a;--on-sand:#f2e4d2;
  --alert:#ff8a80;--alert-soft:#3a1d1b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:780px;margin-inline:auto;display:flex;flex-direction:column;min-height:0}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:15px;height:38px;flex:none}
.brand .mark-body{fill:var(--sand)}
.brand .mark-well{fill:var(--accent)}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.01em}
.sub{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.proto{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink2);color:var(--ink2);padding:2px 6px;border-radius:3px;margin-left:4px;vertical-align:middle}
.top-actions{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn-staff{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px}
.btn-staff:hover{filter:brightness(1.07)}

/* Tabs */
.tabs{display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.tim{margin-left:auto;font-size:12.5px;font-weight:500}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:18px 28px}

/* Chat */
.rolebar{display:flex;align-items:center;gap:8px;padding-block:10px 0;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.rolebar b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.chat{flex:1;min-height:0;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--surface);border:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.msg p{margin:0}
.msg p + p{margin-top:8px}
.msg.user{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:16px 4px 16px 16px}
.msg.alert{background:var(--alert-soft);border-color:var(--alert)}
.msg.alert .lead{font-weight:600;color:var(--alert)}
.tech{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:13.5px}
.tech b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;font-weight:500}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.roles button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-weight:600}
.roles button:hover,.roles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sources{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.sources .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.src{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12.5px;color:var(--ink2)}
.src code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:3px}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.fact{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.draft{background:var(--sand);border-color:var(--sand);color:var(--on-sand)}
.pill.todo{border-style:dashed;color:var(--ink2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-line{background:var(--surface);border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:999px}
.btn-line:hover{background:var(--accent-soft)}
.btn-line.danger{border-color:var(--alert);color:var(--alert)}
.btn-fill{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:blink 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.typing i{animation:none;opacity:.6}}

.dock{padding-top:8px;padding-bottom:12px;border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.ask button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:0 18px}
.ask .mic{flex:none;width:46px;padding:0;display:grid;place-items:center;background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.ask .mic svg{width:20px;height:20px;fill:currentColor}
.ask .mic[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:var(--accent-ink);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--alert-soft)}}
@media (prefers-reduced-motion: reduce){.ask .mic[aria-pressed="true"]{animation:none}}
.vswitch{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:13px;color:var(--ink2)}
.vswitch .trk{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative}
.vswitch .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:1px solid var(--ink2)}
.vswitch[aria-checked="true"] .trk{background:var(--accent)}
.vswitch[aria-checked="true"] .trk::after{left:16px;border-color:var(--accent)}
.btn-line[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.disc{margin:7px 0 0;font-size:12px;color:var(--ink2)}

/* Kenali */
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 8px;text-wrap:balance}
.lead2{color:var(--ink2);margin:0 0 18px;max-width:62ch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;align-items:start}
.patch{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto}
.p-body{fill:var(--sand);stroke:var(--line);stroke-width:1.5}
.p-well{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pg{cursor:pointer}
.pg:hover .p-well{fill:var(--bg)}
.pg.on .p-well{fill:var(--accent)}
.p-num{fill:var(--accent);font-family:var(--f-mono);font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pg.on .p-num{fill:var(--accent-ink)}
.pg:focus-visible{outline:none}
.pg:focus-visible .p-well{stroke-width:5}
.p-dim{stroke:var(--ink2);stroke-width:1.2;fill:none}
.p-txt{fill:var(--ink2);font-family:var(--f-body);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card p{margin:0}
.card p + p{margin-top:8px}
.wellinfo{min-height:96px}
.wellinfo .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flows{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12.5px;display:grid;place-items:center}
.note{font-size:12.5px;color:var(--ink2);margin-top:12px}

/* Kuis */
.qcount{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.qtext{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.score{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:4px 0 8px}

/* Panel tim */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lst li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.lst li span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink2);flex:none}
.tag-ex{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px dashed var(--ink2);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.kiosk{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px}
.kiosk input{width:18px;height:18px;accent-color:var(--accent)}

/* Mode suara */
.btn-voice{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.btn-voice svg{width:16px;height:16px;fill:currentColor}
.btn-voice:hover{background:var(--accent-soft)}
.vo{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vo-exit{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink2)}
.vo-body{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:640px;margin-inline:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:8px}
.vo-patch{height:min(34vh,300px);width:auto;max-width:100%;flex:none;cursor:pointer}
.vo-patch .body{fill:var(--sand);stroke:var(--line);stroke-width:1.5}
.vo-patch .w{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center}
.st-listening .w{animation:breathe 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
.st-thinking .w{animation:sweep 1.1s linear infinite;animation-delay:calc(var(--i) * .1s)}
.st-speaking .w{fill:var(--accent);animation:talk .8s ease-in-out infinite;animation-delay:calc(var(--i) * .09s)}
.st-blocked .w{fill:var(--alert-soft);stroke:var(--alert)}
@keyframes breathe{0%,100%{transform:scale(1);fill:var(--accent-soft)}50%{transform:scale(1.14);fill:var(--accent)}}
@keyframes sweep{0%,100%{fill:var(--accent-soft)}35%{fill:var(--accent)}}
@keyframes talk{0%,100%{transform:scale(.92)}50%{transform:scale(1.2)}}
@media (prefers-reduced-motion: reduce){
  .st-listening .w,.st-thinking .w,.st-speaking .w{animation:none}
  .st-listening .w{fill:var(--accent)}
  .st-thinking .w{fill:var(--sand)}
}
.vo-status{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0}
.vo-you{margin:0;min-height:1.4em;font-size:18px;color:var(--ink2);overflow-wrap:anywhere}
.vo-bot{width:100%;max-height:30vh;overflow-y:auto;text-align:left;font-size:18px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-wrap:anywhere}
.vo-bot p{margin:0}
.vo-hint{margin:0;font-size:15px;color:var(--ink2);max-width:46ch}
.vo-start{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.vo-start .btn-fill{font-size:18px;padding:14px 22px}
.vo-demo{width:100%;border-top:1px dashed var(--line);padding-top:12px}
.vo-demo .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:8px}
.vo-demo .row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

/* Sheet dan toast */
.scrim{position:fixed;inset:0;background:rgba(6,20,19,.55);display:grid;place-items:center;padding:16px;z-index:30}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
.sheet p{margin:0 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:40;text-align:center}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 20 50" aria-hidden="true">
        <rect class="mark-body" x="1" y="1" width="18" height="48" rx="4"/>
        <circle class="mark-well" cx="6.5" cy="9" r="3.2"/><circle class="mark-well" cx="13.5" cy="9" r="3.2"/>
        <circle class="mark-well" cx="6.5" cy="17" r="3.2"/><circle class="mark-well" cx="13.5" cy="17" r="3.2"/>
        <circle class="mark-well" cx="6.5" cy="25" r="3.2"/><circle class="mark-well" cx="13.5" cy="25" r="3.2"/>
        <circle class="mark-well" cx="6.5" cy="33" r="3.2"/><circle class="mark-well" cx="13.5" cy="33" r="3.2"/>
        <circle class="mark-well" cx="6.5" cy="41" r="3.2"/><circle class="mark-well" cx="13.5" cy="41" r="3.2"/>
      </svg>
      <div>
        <span class="wordmark">Alergen</span><span class="proto" data-t="proto"></span>
        <span class="sub" data-t="sub"></span>
      </div>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Bahasa / Language">
        <button type="button" id="lang-id" aria-pressed="true">ID</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="btn-voice" id="btn-voice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg><span data-t="voiceBtn"></span></button>
      <button type="button" class="btn-staff" id="btn-staff" data-t="staff"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-tanya" data-view="tanya" data-t="tabAsk"></button>
    <button type="button" class="tab" role="tab" id="tab-kenali" data-view="kenali" data-t="tabExplore"></button>
    <button type="button" class="tab" role="tab" id="tab-kuis" data-view="kuis" data-t="tabQuiz"></button>
    <button type="button" class="tab tim" role="tab" id="tab-panel-tim" data-view="panel-tim" data-t="tabTeam"></button>
  </nav>

  <section class="view" id="v-tanya">
    <div class="rolebar" id="rolebar"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="dock">
      <div class="chips" id="chips"></div>
      <form class="ask" id="form" autocomplete="off">

/* Mesin tanya jawab prototipe: guardrail + retrieval berbasis kata kunci (TF-IDF ringan).
   Di produksi, bagian retrieval diganti embedding + pgvector dan jawaban disusun LLM dari potongan yang sama. */
const STOP = new Set((
  'yang dan di ke dari untuk dengan atau apa apakah saya anda itu ini ada adalah bisa dapat akan pada dalam ya tidak bukan sudah belum juga lebih ' +
  'siapa kapan berapa bagaimana mengapa kenapa dimana mana saja kah dong deh nih sih lah ' +
  'the a an of to is are and or in on for with do does can i you it this that be what how when who where why which my me your am was were at by'
).split(' '));

function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
function stem(w) {
  if (w.length > 5 && w.endsWith('nya')) w = w.slice(0, -3);
  if (w.length > 4 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0, -1);
  return w;
}
function toks(s) {
  return norm(s).split(' ').filter(w => w.length > 1 && !STOP.has(w)).map(stem);
}

const INDEX = (function () {
  const docs = KB.map(c => ({
    c,
    kw: new Set(toks(c.kw)),
    ti: new Set(toks(c.title.id + ' ' + c.title.en + ' ' + c.q.id + ' ' + c.q.en)),
    tx: new Set(toks(c.text.id + ' ' + c.text.en)),
    qn: [norm(c.q.id), norm(c.q.en)]
  }));
  const df = new Map();
  docs.forEach(d => {
    new Set([...d.kw, ...d.ti, ...d.tx]).forEach(t => df.set(t, (df.get(t) || 0) + 1));
  });
  return { docs, df, N: docs.length };
})();

function idf(t) {
  const d = INDEX.df.get(t);
  return Math.log(1 + INDEX.N / (d || 0.5));
}

function retrieve(query) {
  const qt = [...new Set(toks(query))];
  const qn = norm(query);
  const den = qt.reduce((s, t) => s + idf(t) * 3, 0) || 1;
  const ranked = INDEX.docs.map(d => {
    let score = 0;
    qt.forEach(t => {
      let w = 0;
      if (d.kw.has(t)) w = 3;
      else if (d.ti.has(t)) w = 2;
      else if (d.tx.has(t)) w = 1;
      if (w && INDEX.df.has(t)) score += idf(t) * w;
    });
    if (d.qn.includes(qn)) score += 1000;
    return { c: d.c, score, cov: score / den };
  }).sort((a, b) => b.score - a.score);
  return ranked;
}

const MIN_SCORE = 2.2;
const MIN_COV = 0.3;

const RX = {
  inject: /(abaikan|lupakan|abaikanlah).*(instruksi|perintah|aturan|petunjuk)|ignore (all |your |the |previous )*(instructions|rules)|system prompt|jailbreak|pretend (you|to)/,
  emergency: /\b(sesak|susah napas|sulit napas|tidak bisa napas|anafilaksis|anaphylaxis|pingsan|kejang|bibir bengkak|wajah bengkak|lidah bengkak|tenggorokan bengkak|shortness of breath|cant breathe|can t breathe|trouble breathing|difficulty breathing|fainted|passed out|seizure)\b|bengkak.{0,12}(bibir|wajah|lidah|tenggorokan)|swollen (lip|lips|face|tongue|throat)|(bibir|wajah|lidah|tenggorokan) (saya |anak saya )?(bengkak|membengkak)/,
  dose: /\b(dosis|takaran|dose|dosage|mg|miligram)\b|berapa (kali|tablet|butir|banyak|mg)|how (many|much) (tablet|tablets|mg|times|pills)|aturan pakai|jadwal minum|jadwal pakai/,
  thanks: /^(terima kasih|makasih|thanks|thank you|thx)\b/,
  greet: /^(halo|hai|hi|hello|hey|selamat (pagi|siang|sore|malam)|good (morning|afternoon|evening)|oke|ok|siap)\b/,
  personalWho: /\b(saya|aku|anak saya|ibu saya|bapak saya|suami saya|istri saya|my (child|son|daughter|mother|father|wife|husband|baby)|i am|i have|i m|i got|am i|can i|should i|do i|is it safe for me)\b/,
  personalWhat: /(alergi|alergen|ruam|gatal|bentol|gejala|boleh|aman|cocok|pakai|minum|diagnos|sembuh|allerg|rash|itch|symptom|safe|suitable|diagnos|cure|use|take)/
};

function respond(text, role) {
  const n = norm(text);
  const out = { kind: 'answer', chunks: [], score: 0, query: text };

  if (RX.inject.test(n)) { out.kind = 'inject'; return out; }
  if (RX.emergency.test(n)) { out.kind = 'emergency'; out.chunks = [KB.find(c => c.id === 'KB-11')]; return out; }
  if (RX.dose.test(n)) { out.kind = 'dose'; out.chunks = [KB.find(c => c.id === 'KB-08')]; return out; }
  if (n.split(' ').length <= 4) {
    if (RX.thanks.test(n)) { out.kind = 'thanks'; return out; }
    if (RX.greet.test(n)) { out.kind = 'greet'; return out; }
  }

  const ranked = retrieve(text);
  const top = ranked[0];
  const hit = top.score >= MIN_SCORE && top.cov >= MIN_COV;
  out.score = top.score;

  const personal = RX.personalWho.test(n) && RX.personalWhat.test(n);
  if (personal) {
    out.kind = 'personal';
    const picks = [];
    if (hit) picks.push(top.c);
    const fallback = KB.find(c => c.id === 'KB-08');
    if (!picks.includes(fallback)) picks.push(fallback);
    out.chunks = picks.slice(0, 2);
    return out;
  }

  if (!hit) { out.kind = 'none'; return out; }

  out.chunks = [top.c];
  const second = ranked[1];
  if (second && second.score >= top.score * 0.6 && second.score >= MIN_SCORE && second.cov >= MIN_COV && top.score < 1000) {
    out.chunks.push(second.c);
  }
  return out;
}

  const SEED_TOP = [['Apa itu patch Alergen?', 23], ['Kapan dijual dan berapa harganya?', 17], ['Apakah aman untuk anak?', 14], ['Apakah tablet ini menyembuhkan alergi?', 8]];
  const SEED_NONE = ['Apakah patch terasa sakit saat dilepas?', 'Bisa dipesan lewat marketplace?'];

  const state = {
    lang: LS.get('alergen-lang') === 'en' ? 'en' : 'id',
    role: null, view: 'tanya', msgs: [], well: null,
    quiz: { i: 0, score: 0, picked: null, done: false },
    log: [], kiosk: false, voice: false, last: Date.now()
  };
  try { state.log = JSON.parse(LS.get('alergen-log') || '[]').slice(-200); } catch (e) { state.log = []; }

  const t = k => T[state.lang][k];
  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function btn(label, cls, fn) {
    const b = el('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }
  function saveLog() { LS.set('alergen-log', JSON.stringify(state.log.slice(-200))); }
  function touch() { state.last = Date.now(); }
  function roleLabel(k) { const r = ROLES.find(x => x.k === k); return r ? r[state.lang] : t('noRole'); }
  function chunkById(id) { return KB.find(c => c.id === id); }

  let toastTimer = null;
  function toast(msg) {
    const n = $('#toast');
    n.textContent = msg; n.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { n.hidden = true; }, 3600);
  }

  /* ---------- Chat ---------- */
  function initChat() {
    state.msgs = [{ from: 'bot', type: 'welcome' }];
  }

  function renderRolebar() {
    const bar = $('#rolebar');
    bar.textContent = '';
    bar.appendChild(el('span', null, t('role') + ':'));
    bar.appendChild(el('b', null, roleLabel(state.role)));
    bar.appendChild(btn(state.role ? t('change') : t('pick'), 'linkbtn', () => {
      touch();
      state.msgs.push({ from: 'bot', type: 'welcome' });
      renderChat();
    }));
    if (synth) {
      const sw = el('button', 'vswitch');
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', String(state.voice));
      sw.appendChild(el('span', null, t('voiceMode')));
      sw.appendChild(el('span', 'trk'));
      sw.addEventListener('click', () => { touch(); state.voice = !state.voice; if (!state.voice) stopSpeech(); renderRolebar(); });
      bar.appendChild(sw);
    }
  }

  function renderChips() {
    const box = $('#chips');
    box.textContent = '';
    const ids = state.role ? CHIPS[state.role] : DEFAULT_CHIPS;
    ids.forEach(id => {
      const c = chunkById(id);
      box.appendChild(btn(c.q[state.lang], 'chip', () => ask(c.q[state.lang])));
    });
  }

  function sourceRow(c) {
    const row = el('div', 'src');
    row.appendChild(el('code', null, c.id));
    row.appendChild(el('span', null, c.title[state.lang]));
    const tag = { fact: ['fact', 'tagFact'], draft: ['draft', 'tagDraft'], todo: ['todo', 'tagTodo'] }[c.status];
    row.appendChild(el('span', 'pill ' + tag[0], t(tag[1])));
    return row;
  }

  function renderBot(m) {
    if (m.type === 'welcome') {
      const d = el('div', 'msg');
      d.appendChild(el('p', null, t('welcome')));
      const g = el('div', 'roles');
      ROLES.forEach(r => {
        const b = btn(r[state.lang], null, () => {
          touch();
          state.role = r.k;
          state.msgs.push({ from: 'user', text: r[state.lang] });
          state.msgs.push({ from: 'bot', type: 'roleSet' });
          renderChat(); renderChips(); renderRolebar();
        });
        b.setAttribute('aria-pressed', String(state.role === r.k));
        g.appendChild(b);
      });
      d.appendChild(g);
      return d;
    }
    if (m.type === 'roleSet') { const d = el('div', 'msg'); d.appendChild(el('p', null, t('roleSet'))); return d; }

    const res = m.res;
    const d = el('div', 'msg' + (res.kind === 'emergency' ? ' alert' : ''));
    const leadKey = LEAD[res.kind];
    if (leadKey) d.appendChild(el('p', res.kind === 'emergency' ? 'lead' : null, t(leadKey)));

    if (res.kind !== 'emergency') {
      res.chunks.forEach((c, i) => {
        if (res.kind === 'dose') return;
        const p = el('p', null, c.text[state.lang]);
        d.appendChild(p);
        if (m.role === 'nakes' && c.tech) {
          const tb = el('div', 'tech');
          tb.appendChild(el('b', null, t('techLabel')));
          tb.appendChild(document.createTextNode(c.tech[state.lang]));
          d.appendChild(tb);
        }
      });
    } else {
      d.appendChild(el('p', null, res.chunks[0].text[state.lang]));
    }

    const needStaff = ['emergency', 'dose', 'personal', 'none'].includes(res.kind);
    const acts = el('div', 'actions');
    if (synth) {
      const lb = btn(t('listen'), 'btn-line listen', () => {
        touch();
        if (speaking && speaking.btn === lb) stopSpeech(); else speak(botSpeech(m), lb);
      });
      lb.setAttribute('aria-pressed', 'false');
      acts.appendChild(lb);
    }
    if (needStaff) acts.appendChild(btn(t('staff'), 'btn-line' + (res.kind === 'emergency' ? ' danger' : ''), openSheet));
    if (res.kind === 'answer' || res.kind === 'personal') {
      const first = res.chunks[0];
      const rel = (first.related || []).map(chunkById).filter(c => c && !res.chunks.includes(c)).slice(0, 2);
      rel.forEach(c => acts.appendChild(btn(c.q[state.lang], 'btn-line', () => ask(c.q[state.lang]))));
    }
    if (acts.childNodes.length) d.appendChild(acts);

    const srcChunks = res.chunks;
    if (srcChunks.length && ['answer', 'personal', 'emergency'].includes(res.kind)) {
      const s = el('div', 'sources');
      s.appendChild(el('span', 'lbl', t('sources')));
      srcChunks.forEach(c => s.appendChild(sourceRow(c)));
      d.appendChild(s);
    }
    return d;
  }

  function renderChat() {
    const chat = $('#chat');
    chat.textContent = '';
    state.msgs.slice(-60).forEach(m => {
      if (m.from === 'user') chat.appendChild(el('div', 'msg user', m.text));
      else chat.appendChild(renderBot(m));
    });
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const d = el('div', 'msg'); d.id = 'typing';
    const tp = el('span', 'typing');
    tp.appendChild(el('i')); tp.appendChild(el('i')); tp.appendChild(el('i'));
    d.appendChild(tp);
    $('#chat').appendChild(d);
    $('#chat').scrollTop = $('#chat').scrollHeight;
  }

  function ask(text) {
    text = String(text || '').trim().slice(0, 300);
    if (!text) return;
    touch();
    stopSpeech();
    state.msgs.push({ from: 'user', text });
    renderChat();
    showTyping();
    const res = respond(text, state.role);
    state.log.push({ t: Date.now(), q: text.replace(/[0-9]{6,}/g, '***'), kind: res.kind, id: res.chunks[0] ? res.chunks[0].id : null });
    saveLog();
    setTimeout(() => {
      state.msgs.push({ from: 'bot', type: 'answer', res, role: state.role });
      renderChat();
      if (state.voice && synth) {
        const bm = state.msgs[state.msgs.length - 1];
        const lbs = document.querySelectorAll('#chat .listen');
        speak(botSpeech(bm), lbs[lbs.length - 1] || null);
      }
      if (state.view === 'panel-tim') renderTim();
    }, reduced ? 0 : 450);
  }

  /* ---------- Sheet staf ---------- */
  function openSheet() {

  function say(text, token) {
    return new Promise(resolve => {
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { resolve(false); return; }
      try { synth.cancel(); } catch (e) { /* abaikan */ }
      const clean = speakable(text);
      const parts = (clean.match(/[^.!?]+[.!?]*/g) || [clean]).map(s => s.trim()).filter(Boolean);
      let i = 0, ok = true;
      const next = () => {
        if (token !== vm.token || i >= parts.length) { resolve(ok); return; }
        const part = parts[i++];
        const u = new SpeechSynthesisUtterance(part);
        u.lang = langTag();
        const v = pickVoice();
        if (v) u.voice = v;
        u.rate = 0.95;
        let fin = false;
        const go = good => { if (fin) return; fin = true; clearTimeout(wd); if (!good) ok = false; next(); };
        const wd = setTimeout(() => go(true), Math.max(4000, part.length * 130));
        u.onend = () => go(true);
        u.onerror = ev => {
          const c = ev && ev.error;
          if (c === 'canceled' || c === 'interrupted') { fin = true; clearTimeout(wd); resolve(true); } else go(false);
        };
        try { synth.speak(u); } catch (e) { go(false); }
      };
      next();
    });
  }

  function hear() {
    return new Promise(resolve => {
      let r;
      try { r = new SR(); } catch (e) { resolve({ text: '', error: 'not-allowed' }); return; }
      vm.rec = r;
      r.lang = langTag(); r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
      let finalText = '', err = null, done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(guard); vm.rec = null; resolve({ text: finalText.trim(), error: err }); };
      const guard = setTimeout(() => { try { r.stop(); } catch (e) { finish(); } }, 15000);
      r.onresult = ev => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const res = ev.results[i];
          if (res.isFinal) finalText += res[0].transcript; else interim += res[0].transcript;
        }
        $('#vo-you').textContent = t('vYou') + ': ' + (finalText + interim).trim();
      };
      r.onerror = ev => { err = (ev && ev.error) || 'error'; };
      r.onend = finish;
      try { r.start(); } catch (e) { err = 'not-allowed'; finish(); }
    });
  }

    $('#vo-you').textContent = t('vYou') + ': ' + text;
    const speakIt = async (msg, res) => { vBot(msg, res || null); vSet('speaking'); await say(msg, token); };

    if (RXV.end.test(n)) { await endSession(token, false); return; }
    if (words <= 6 && RXV.en.test(n)) { state.lang = 'en'; LS.set('alergen-lang', 'en'); applyLang(); await speakIt(t('vLangSet')); return; }
    if (words <= 6 && RXV.id.test(n)) { state.lang = 'id'; LS.set('alergen-lang', 'id'); applyLang(); await speakIt(t('vLangSet')); return; }
    if (words <= 6 && RXV.staff.test(n)) {
      state.log.push({ t: Date.now(), q: '', kind: 'staff', id: null }); saveLog();
      await speakIt(t('vStaff'));
      return;
    }
    if (words <= 4 && RXV.repeat.test(n)) { await speakIt(vm.last || t('vNoRepeat')); return; }
    if (words <= 7 && RXV.me.test(n)) {
      const hit = ROLE_RX.find(x => x[1].test(n));
      if (hit) {
        state.role = hit[0]; renderRolebar(); renderChips();
        await speakIt(t('vRole').replace('%s', roleLabel(hit[0])));
        return;
      }
    }

    const res = respond(text, state.role);
    state.log.push({ t: Date.now(), q: text.replace(/[0-9]{6,}/g, '***'), kind: res.kind, id: res.chunks[0] ? res.chunks[0].id : null });
    saveLog();
    state.msgs.push({ from: 'user', text: text });
    state.msgs.push({ from: 'bot', type: 'answer', res: res, role: state.role });
    renderChat();
    let msg = botSpeech({ res: res, role: state.role });
    if (res.kind === 'greet') msg = t('vGreetShort');
    if (res.kind === 'thanks') msg = t('vThanksShort');
    vm.last = msg;
    await speakIt(msg, res);
    vm.turns++;
    if (token === vm.token && res.kind === 'answer' && vm.turns % 3 === 1) await say(t('vFollow'), token);
  }

  async function runSession(lang) {
    if (lang && lang !== state.lang) { state.lang = lang; LS.set('alergen-lang', lang); applyLang(); }
    const token = ++vm.token;
    vm.running = true; vm.turns = 0; vm.silent = 0; vm.last = '';
    vShowStart(false); $('#vo-demo').hidden = true; vBot('', null); $('#vo-you').textContent = '';
    if (!SR) { vBlocked('nosr'); return; }
    vSet('thinking');
    const ok = await micProbe();
    if (token !== vm.token) return;
    if (!ok) { vBlocked('mic'); return; }
    vSet('speaking');
    vBot(t('vGreet'), null);
    await say(t('vGreet'), token);
    await sleep(300);
    while (token === vm.token) {
      touch();
      vSet('listening');
      const r = await hear();
      if (token !== vm.token) return;
      if (r.error && ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].indexOf(r.error) >= 0) { vBlocked('mic'); return; }
      if (r.error === 'network') { vBlocked('network'); return; }
      if (!r.text) {
        vm.silent++;
        if (vm.silent >= 6) { await endSession(token, true); return; }
        if (vm.silent === 3) { vSet('speaking'); vBot(t('vStill'), null); await say(t('vStill'), token); }
        await sleep(300);
        continue;
      }
      vm.silent = 0;
      vSet('thinking');
      await handle(r.text, token);
      await sleep(350);
    }
  }

  async function vDemo(text) {
    const token = ++vm.token;
    vm.running = true;
    vSet('thinking');
    await handle(text, token);
    if (token === vm.token) { vm.running = false; vSet('blocked'); }
  }

  function openVoice() {
    vm.open = true;
    stopSpeech(); stopMic();
    $('#vo').hidden = false;
    $('#vo-you').textContent = ''; vBot('', null); $('#vo-demo').hidden = true;
    vSet('ready'); vShowStart(true); vRefresh();
    $('#vo-go-id').focus();
  }
  function closeVoice() {
    vm.open = false; vm.token++; vm.running = false;
    if (vm.rec) { try { vm.rec.abort(); } catch (e) { /* abaikan */ } }
    if (synth) { try { synth.cancel(); } catch (e) { /* abaikan */ } }
    $('#vo').hidden = true;
  }

  /* ---------- Pasang pendengar ---------- */
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { touch(); location.hash = b.getAttribute('data-view'); }));
  window.addEventListener('hashchange', route);
  $('#lang-id').addEventListener('click', () => { state.lang = 'id'; LS.set('alergen-lang', 'id'); applyLang(); });
  $('#lang-en').addEventListener('click', () => { state.lang = 'en'; LS.set('alergen-lang', 'en'); applyLang(); });
  $('#btn-staff').addEventListener('click', () => { touch(); openSheet(); });
  $('#btn-voice').addEventListener('click', () => { touch(); location.hash = 'suara'; });
  $('#vo-exit').addEventListener('click', () => { location.hash = 'tanya'; });
  $('#vo-go-id').addEventListener('click', () => { touch(); runSession('id'); });
  $('#vo-go-en').addEventListener('click', () => { touch(); runSession('en'); });
  $('#vo-patch').addEventListener('click', () => { if (vm.running && synth) { try { synth.cancel(); } catch (e) { /* abaikan */ } } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && vm.open && vm.running) {
      vm.token++; vm.running = false;
      if (vm.rec) { try { vm.rec.abort(); } catch (e) { /* abaikan */ } }
      if (synth) { try { synth.cancel(); } catch (e) { /* abaikan */ } }
      vSet('ready'); vShowStart(true);
    }
  });
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  $('#sheet-ok').addEventListener('click', () => {
    state.log.push({ t: Date.now(), q: '', kind: 'staff', id: null });
    saveLog(); closeSheet(); toast(t('staffToast'));
    if (state.view === 'panel-tim') renderTim();
  });
  $('#form').addEventListener('submit', e => { e.preventDefault(); const i = $('#q'); const v = i.value; i.value = ''; ask(v); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, touch, { passive: true }));
  setInterval(() => { if (state.kiosk && Date.now() - state.last > 90000) { state.last = Date.now(); resetKiosk(); } }, 5000);

  buildVoicePatch();
  micSetup();
  initChat();
  applyLang();
  route();
})();
</script>

</body></html>
