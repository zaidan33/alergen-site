<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Public Sans";font-weight:400;font-display:swap;src:url(/assets/fonts/public-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-weight:600;font-display:swap;src:url(/assets/fonts/public-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Schibsted Grotesk";font-weight:600;font-display:swap;src:url(/assets/fonts/schibsted-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Schibsted Grotesk";font-weight:700;font-display:swap;src:url(/assets/fonts/schibsted-grotesk-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{
  --bg:#F2F6F5;--surface:#FFFFFF;--fg:#13262A;--muted:#51666A;--line:#D3DEDC;
  --accent:#0A6C6E;--accent-fg:#FFFFFF;--pill:#E3EEEC;--well:#CFE3E0;--well-line:#9DBDB8;
  --font-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1A1C;--surface:#152427;--fg:#E4EEEC;--muted:#9DB2B0;--line:#26393C;
  --accent:#5DC8BF;--accent-fg:#06201F;--pill:#1D3033;--well:#22393B;--well-line:#3F6266;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-direction:column;gap:14px}
.patch{width:148px;height:auto;display:block}
.patch rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.patch circle{fill:var(--well);stroke:var(--well-line);stroke-width:1.2}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);max-width:56ch}
.ident{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 0;padding:0;list-style:none}
.facts li{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1;color:var(--accent)}
.facts span{font-size:12.5px;color:var(--muted)}
.all{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
section{display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
ul.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.docs>li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;
  grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:10px;scroll-margin-top:16px}
ul.docs>li:target{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.code{font-family:var(--font-mono);font-weight:500;font-size:13px;color:var(--accent);padding-top:2px}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
h3{font-family:var(--font-display);font-weight:600;font-size:16.5px;line-height:1.3;margin:0}
.desc{margin:0;color:var(--muted);font-size:14px}
.tags{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{font-size:11.5px;font-weight:600;background:var(--pill);color:var(--fg);padding:2px 9px;border-radius:99px}
.meta{font-size:12.5px;color:var(--muted)}
.act{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a{color:var(--accent)}
.open,.alt,.dl{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;font-weight:600;font-size:14px;border-radius:8px;text-decoration:none}
.open,.dl{background:var(--accent);color:var(--accent-fg)}
.alt{color:var(--fg);border:1px solid var(--line);background:transparent;font-weight:500}
.open:hover,.dl:hover{filter:brightness(1.08)}
.alt:hover{border-color:var(--accent);color:var(--accent)}
a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.shots{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.shots:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-radius:8px}
.shots figure{margin:0;flex:0 0 150px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.shots img{width:150px;height:auto;aspect-ratio:390/844;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:block}
.shots figcaption{font-size:12px;color:var(--muted);line-height:1.35}
footer{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
footer p{margin:0}
footer strong{color:var(--fg);font-weight:600}
.mail{font-family:var(--font-mono);font-size:13px;color:var(--fg);overflow-wrap:anywhere}
@media (min-width:560px){
  body{padding-block:44px 56px;font-size:16px}
  h1{font-size:34px}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
  ul.docs>li{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
  .act{grid-column:3;justify-content:flex-end}
  .shots figure,.shots img{flex-basis:168px;width:168px}
}
@media print{body{background:#fff;color:#000}.act,.shots,.all{display:none}}

.nf{min-height:60vh;justify-content:center}</style></head>
<body><div class="wrap nf"><header><svg class="patch" viewBox="0 0 150 60" role="img" aria-label="Skema patch dengan sepuluh sumur alergen">
      <rect x="1" y="1" width="148" height="58" rx="9"/>
      <circle cx="19" cy="19" r="9"/><circle cx="48" cy="19" r="9"/><circle cx="77" cy="19" r="9"/><circle cx="106" cy="19" r="9"/><circle cx="131" cy="19" r="9"/>
      <circle cx="19" cy="41" r="9"/><circle cx="48" cy="41" r="9"/><circle cx="77" cy="41" r="9"/><circle cx="106" cy="41" r="9"/><circle cx="131" cy="41" r="9"/>
    </svg><h1>Halaman tidak ditemukan</h1>
<p class="sub">Alamat yang dibuka tidak tersedia.</p>
<div class="all"><a class="dl" href="/">Kembali ke daftar dokumen</a></div></header></div></body></html>
